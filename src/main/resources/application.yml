server:
  port: 8080

app:
  # 下载文件保存根目录
  download-dir: ./downloads
  # ffmpeg 可执行文件路径；留空则自动在 PATH 中查找
  ffmpeg-path: ./tools/ffmpeg.exe
  # B 站 Cookie（可选，用于下载大会员/登录画质）；也可在页面用管理口令动态配置（存于 config/cookie.json）
  bilibili-cookie: ""
  # Cookie 管理口令（必填，用于页面动态配置 Cookie 的鉴权；局域网内任意设备输入此口令即可配置）
  # 注意：部署前请务必设置你自己的口令，不要留空
  cookie-admin-token: ""

spring:
  jackson:
    time-zone: GMT+8

logging:
  level:
    com.tylab.biliweb: INFO
