server:
  port: 8080
  # 监听所有网卡（IPv4+IPv6）。注意：不能设为 127.0.0.1，否则 cloudflared 走 IPv4 会 502
  address: 0.0.0.0

app:
  # 下载文件保存根目录
  download-dir: ./downloads
  # ffmpeg 可执行文件路径；留空则自动在 PATH 中查找
  ffmpeg-path: ./tools/ffmpeg.exe
  # B 站 Cookie（可选，用于下载大会员/登录画质）；也可在页面用管理口令动态配置（存于 config/cookie.json）
  bilibili-cookie: ""
  # Cookie 管理口令（采用加盐 SHA-256 哈希密文存储，不可逆，绝证明文泄露）
  cookie-admin-token: "sha256:biliweb_salt:89654fb6011cb34a00172019bcbf97f0b2188ab53aa845d90d6ab773f3daa9f2"
  # 全局访问保护口令（可选，配置后访问解析与下载 API 需鉴权；留空则任何人可使用，适用于内网或受信环境）
  access-token: ""

spring:
  jackson:
    time-zone: GMT+8

logging:
  level:
    com.tylab.biliweb: INFO
