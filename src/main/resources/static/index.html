<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bili Web 下载器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #333; min-height: 100vh;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  header .logo { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg,#fb7299,#ff9db9); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; }
  header h1 { font-size: 20px; }
  header .spacer { flex: 1; }
  .link-btn { background: none; border: 1px solid #ddd; color: #666; padding: 8px 14px; border-radius: 9px; font-size: 13px; cursor: pointer; }
  .link-btn:hover { background: #f0f1f3; }
  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 460px; max-width: 92vw; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal h3 { font-size: 16px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 13px; color: #666; margin: 12px 0 6px; }
  .modal input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; box-sizing: border-box; resize: vertical; min-height: 90px; font-family: monospace; }
  .modal .row { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .cookie-status { font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #f7f8fa; line-height: 1.6; }
  .cookie-status .ok { color: #30a46c; font-weight: 600; }
  .cookie-status .bad { color: #e5484d; font-weight: 600; }
  .cookie-status .muted { color: #999; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 18px; }
  .input-row { display: flex; gap: 10px; }
  .input-row input { flex: 1; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; }
  .input-row input:focus { border-color: #fb7299; }
  .btn { padding: 12px 22px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; background: #fb7299; color: #fff; }
  .btn:hover { background: #f05a86; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .btn.ghost { background: #f0f1f3; color: #555; }
  .btn.ghost:hover { background: #e2e4e8; }
  .hint { font-size: 12px; color: #999; margin-top: 8px; }
  .video-info { display: flex; gap: 16px; margin-top: 16px; }
  .video-info img { width: 160px; height: 100px; object-fit: cover; border-radius: 8px; background:#eee; }
  .video-info .meta { flex: 1; }
  .video-info h2 { font-size: 16px; line-height: 1.4; margin-bottom: 10px; }
  .select-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .select-row label { font-size: 13px; color: #666; }
  .select-row select { padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .task { border: 1px solid #eee; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .task .top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .task .title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .status { font-size: 13px; white-space: nowrap; }
  .task .bar { height: 8px; background: #f0f1f3; border-radius: 5px; overflow: hidden; }
  .task .bar > div { height: 100%; background: linear-gradient(90deg,#fb7299,#ff9db9); width: 0; transition: width .4s; }
  .task .sub { display: flex; justify-content: space-between; font-size: 12px; color: #999; margin-top: 6px; }
  .task .err { color: #e5484d; font-size: 13px; margin-top: 6px; word-break: break-all; }
  .task .actions { margin-top: 8px; display: flex; gap: 8px; }
  .status-done { color: #30a46c; } .status-fail { color: #e5484d; } .status-run { color: #fb7299; }
  .empty { color: #aaa; text-align: center; padding: 20px 0; font-size: 14px; }
  .err-msg { color: #e5484d; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">B</div>
    <h1>Bili Web 下载器</h1>
    <div class="spacer"></div>
    <button class="link-btn" onclick="openCookieModal()">Cookie 设置</button>
  </header>

  <div class="card">
    <div class="input-row">
      <input id="urlInput" placeholder="粘贴 B 站视频链接，如 https://www.bilibili.com/video/BVxxxxxxxxxx" />
      <button class="btn" id="parseBtn" onclick="parse()">解析</button>
    </div>
    <div class="hint">支持 BV 号 / av 号 / 完整视频链接（含分P）</div>
    <div id="parseErr" class="err-msg"></div>

    <div id="videoInfo" style="display:none">
      <div class="video-info">
        <img id="cover" src="" alt="cover" />
        <div class="meta">
          <h2 id="vtitle"></h2>
          <div class="select-row">
            <label>分P</label>
            <select id="pageSelect" onchange="loadFormats()"></select>
            <label>画质</label>
            <select id="formatSelect"></select>
            <button class="btn" id="dlBtn" onclick="startDownload()">开始下载</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px;font-size:15px;">下载任务</h3>
    <div id="taskList"><div class="empty">暂无任务</div></div>
  </div>
</div>

<!-- Cookie 设置弹窗 -->
<div class="modal-mask" id="cookieModal" onclick="if(event.target===this)closeCookieModal()">
  <div class="modal">
    <h3>Cookie 设置</h3>
    <div class="cookie-status" id="cookieStatus">加载中…</div>
    <label>管理口令</label>
    <input type="password" id="adminToken" placeholder="输入管理口令（配置于 application.yml 的 app.cookie-admin-token）" />
    <label>B 站 Cookie</label>
    <textarea id="cookieInput" placeholder="浏览器登录 B 站后，按 F12 → 网络/Application 复制完整 Cookie（SESSDATA=...; bili_jct=...; 等）"></textarea>
    <div class="row">
      <button class="btn ghost" onclick="closeCookieModal()">关闭</button>
      <button class="btn" id="saveCookieBtn" onclick="saveCookie()">保存并生效</button>
    </div>
  </div>
</div>

<script>
let currentVideo = null;

async function parse() {
  const url = document.getElementById('urlInput').value.trim();
  const err = document.getElementById('parseErr');
  err.textContent = '';
  if (!url) { err.textContent = '请输入链接'; return; }
  const btn = document.getElementById('parseBtn');
  btn.disabled = true; btn.textContent = '解析中…';
  try {
    const resp = await fetch('/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await resp.json();
    if (!resp.ok) { err.textContent = data.error || '解析失败'; return; }
    currentVideo = data;
    document.getElementById('cover').src = data.cover || '';
    document.getElementById('vtitle').textContent = data.title;
    const sel = document.getElementById('pageSelect');
    sel.innerHTML = '';
    (data.pages || []).forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (data.pages.length > 1 ? 'P' + p.page + ' ' : '') + (p.part || ('P' + p.page));
      sel.appendChild(opt);
    });
    document.getElementById('videoInfo').style.display = 'block';
    loadFormats();
  } catch (e) {
    err.textContent = '网络错误: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '解析';
  }
}

async function loadFormats() {
  if (!currentVideo) return;
  const page = currentVideo.pages[document.getElementById('pageSelect').value];
  const sel = document.getElementById('formatSelect');
  sel.innerHTML = '<option>加载中…</option>';
  try {
    const resp = await fetch('/api/formats?bvid=' + encodeURIComponent(currentVideo.bvid) + '&cid=' + page.cid);
    const data = await resp.json();
    if (!resp.ok) { sel.innerHTML = ''; return; }
    sel.innerHTML = '';
    data.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.quality;
      opt.textContent = f.description + ' (' + f.quality + ')';
      sel.appendChild(opt);
    });
  } catch (e) {
    sel.innerHTML = '<option>加载失败</option>';
  }
}

async function startDownload() {
  if (!currentVideo) return;
  const page = currentVideo.pages[document.getElementById('pageSelect').value];
  const quality = parseInt(document.getElementById('formatSelect').value, 10);
  const body = {
    bvid: currentVideo.bvid,
    cid: page.cid,
    quality: quality,
    videoTitle: currentVideo.title,
    pageTitle: page.part || ('P' + page.page),
    pagePart: currentVideo.pages.length > 1 ? ('P' + String(page.page).padStart(2, '0')) : 'P1'
  };
  try {
    const resp = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) { alert(data.error || '创建任务失败'); return; }
    refreshTasks();
  } catch (e) {
    alert('网络错误: ' + e.message);
  }
}

async function refreshTasks() {
  try {
    const resp = await fetch('/api/tasks');
    const list = await resp.json();
    const box = document.getElementById('taskList');
    if (!list.length) { box.innerHTML = '<div class="empty">暂无任务</div>'; return; }
    // 倒序：新任务在前
    list.sort((a, b) => b.createdAt - a.createdAt);
    box.innerHTML = list.map(t => renderTask(t)).join('');
  } catch (e) { /* ignore */ }
}

function renderTask(t) {
  const statusClass = { 'COMPLETED': 'status-done', 'FAILED': 'status-fail', 'CANCELLED': 'status-fail' }[t.status] || 'status-run';
  const pct = Math.round(t.progress || 0);
  let actions = '';
  if (t.status === 'COMPLETED') {
    actions = '<div class="actions"><a class="btn ghost" style="font-size:13px;padding:7px 14px;text-decoration:none" href="/api/task/' + t.id + '/file">下载文件</a><span style="font-size:12px;color:#999;align-self:center">' + (t.outputSize || '') + '</span></div>';
  } else if (['WAITING','DOWNLOADING','MERGING'].includes(t.status)) {
    actions = '<div class="actions"><button class="btn ghost" style="font-size:13px;padding:7px 14px" onclick="cancelTask(\'' + t.id + '\')">取消</button></div>';
  }
  const stage = t.status === 'DOWNLOADING' ? (' ' + (t.stage || '')) : '';
  return '<div class="task">'
    + '<div class="top"><span class="title">' + esc(t.videoTitle) + (t.pagePart !== 'P1' ? ' · ' + esc(t.pagePart) : '') + '</span>'
    + '<span class="status ' + statusClass + '">' + esc(t.statusLabel || t.status) + stage + '</span></div>'
    + (t.status === 'COMPLETED' || t.status === 'FAILED' || t.status === 'CANCELLED' ? '' :
      '<div class="bar"><div style="width:' + pct + '%"></div></div>')
    + (t.error ? '<div class="err">' + esc(t.error) + '</div>' : '')
    + (t.outputFile && t.status !== 'COMPLETED' ? '<div class="sub"><span>' + esc(t.outputFile) + '</span><span>' + pct + '%</span></div>' : '')
    + actions
    + '</div>';
}

async function cancelTask(id) {
  await fetch('/api/task/' + id + '/cancel', { method: 'POST' });
  refreshTasks();
}

/* ---- Cookie 管理 ---- */
function openCookieModal() {
  document.getElementById('cookieModal').classList.add('show');
  document.getElementById('adminToken').value = '';
  document.getElementById('cookieInput').value = '';
  loadCookieStatus();
}

function closeCookieModal() {
  document.getElementById('cookieModal').classList.remove('show');
}

async function loadCookieStatus() {
  const box = document.getElementById('cookieStatus');
  try {
    const r = await fetch('/api/admin/cookie/token-configured');
    const tc = await r.json();
    if (!tc.configured) {
      box.innerHTML = '<span class="bad">未配置管理口令</span><br><span class="muted">请在 application.yml 设置 app.cookie-admin-token 后重启，才能在此管理 Cookie。</span>';
      return;
    }
    const token = document.getElementById('adminToken').value.trim();
    if (!token) {
      box.innerHTML = '<span class="muted">输入管理口令后查看 Cookie 状态</span>';
      return;
    }
    const resp = await fetch('/api/admin/cookie/status', { headers: { 'X-Admin-Token': token } });
    const data = await resp.json();
    if (!resp.ok) {
      box.innerHTML = '<span class="bad">' + esc(data.error || '查询失败') + '</span>';
      return;
    }
    let html;
    if (!data.configured) {
      html = '<span class="muted">未配置 Cookie</span><br><span class="muted">当前只能下载 480P 及以下画质</span>';
    } else if (data.valid) {
      html = '<span class="ok">' + esc(data.message) + '</span>';
      if (data.updatedAt) {
        html += '<br><span class="muted">更新时间: ' + new Date(data.updatedAt).toLocaleString() + '（SESSDATA 约 1~6 个月过期，失效后需重新配置）</span>';
      }
    } else {
      html = '<span class="bad">' + esc(data.message || 'Cookie 已失效') + '</span>';
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<span class="bad">网络错误: ' + esc(e.message) + '</span>';
  }
}

async function saveCookie() {
  const token = document.getElementById('adminToken').value.trim();
  const cookie = document.getElementById('cookieInput').value.trim();
  const btn = document.getElementById('saveCookieBtn');
  if (!token) { alert('请输入管理口令'); return; }
  if (!cookie) { alert('请输入 B 站 Cookie'); return; }
  btn.disabled = true; btn.textContent = '校验中…';
  try {
    const resp = await fetch('/api/admin/cookie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
      body: JSON.stringify({ cookie })
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert('保存失败: ' + (data.error || '未知错误'));
      return;
    }
    const box = document.getElementById('cookieStatus');
    box.innerHTML = '<span class="ok">' + esc(data.message || '已保存并生效') + '</span>';
    document.getElementById('cookieInput').value = '';
  } catch (e) {
    alert('网络错误: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '保存并生效';
  }
}

document.getElementById('adminToken').addEventListener('input', loadCookieStatus);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') parse(); });
refreshTasks();
setInterval(refreshTasks, 1500);
</script>
</body>
</html>
