name: 手动一键部署到云服务器

on:
  workflow_dispatch: # 关键：只有在 GitHub 网页上点击按钮才会触发！

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出最新代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 配置 JDK 17 环境
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. 配置 Maven 镜像并编译打包（防止 Maven 官方中央仓库 429 限流）
      - name: 编译打包
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>aliyunmaven</id>
                <mirrorOf>central</mirrorOf>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          mvn clean package -DskipTests

      # 4. 把打包好的 jar 传输到云服务器
      - name: 传输文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "target/bili-web-0.1.0.jar"
          target: "/www/wwwroot/bili-web/"
          strip_components: 1
          overwrite: true

      # 5. 登录服务器平滑重启 Java 进程
      - name: 重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "正在停止旧的进程..."
            TARGET_PID=$(pgrep -f "java.*bili-web" | head -n 1)
            if [ -n "$TARGET_PID" ]; then
              kill -9 $TARGET_PID || true
            fi
            sleep 2
            
            echo "正在后台启动新版本..."
            cd /www/wwwroot/bili-web
            nohup java -jar bili-web-0.1.0.jar --app.ffmpeg-path=/usr/bin/ffmpeg > app.log 2>&1 < /dev/null &
            sleep 3
            
            echo "检查启动状态："
            ps -ef | grep '[b]ili-web' && echo "部署成功！" || echo "启动失败，请检查日志"